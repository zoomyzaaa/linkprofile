<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffeef5">
  <title>MONA SHOP ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-pink: #f7a9ca;
      --deep-pink: #d978a3;
      --text-brown: #5c474e;
      --text-muted: #9c848d;
      --card-bg: #fff5f8;
      --card-border: #ffdbe8;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffeef4;
      font-family: 'Nunito', 'Mitr', sans-serif;
      color: var(--text-brown);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 25px rgba(240, 160, 195, 0.25);
    }

    /* Banner & Profile */
    .banner-container {
      position: relative;
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, #ffd3e4, #fed6e8, #ffeef6);
      overflow: visible;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-avatar-wrap {
      position: absolute;
      bottom: -45px;
      left: 50%;
      transform: translateX(-50%);
      width: 95px;
      height: 95px;
      border-radius: 50%;
      background: var(--white);
      padding: 4px;
      box-shadow: 0 4px 15px rgba(230, 140, 175, 0.25);
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #ffe3ee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    /* Profile Info */
    .profile-info {
      text-align: center;
      padding: 55px 20px 10px;
    }

    .shop-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-brown);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .shop-bio {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    /* Stats Box */
    .stats-row {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin: 18px 20px 22px;
      text-align: center;
    }

    .stat-item .num {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-brown);
    }

    .stat-item .label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    /* Music Player Card */
    .music-card {
      margin: 0 20px 20px;
      background: #fff0f5;
      border: 1.5px solid var(--card-border);
      border-radius: 24px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 12px rgba(245, 185, 205, 0.15);
    }

    .music-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f7a9ca;
      color: white;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .music-details {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-brown);
      text-transform: uppercase;
    }

    .song-artist {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f4a5c6;
      border: none;
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.15s ease;
    }

    .play-btn:active {
      transform: scale(0.92);
    }

    /* Section Card (Contact & Links) */
    .section-card {
      background: #fff6f9;
      border: 1.5px solid #ffdeeb;
      border-radius: 28px;
      margin: 0 20px 22px;
      padding: 18px 16px 20px;
    }

    .section-header {
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-brown);
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    /* Action Links (LINE, Instagram, etc.) */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pill-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--white);
      border: 1.5px solid #ffdbe8;
      border-radius: 20px;
      padding: 12px 16px;
      text-decoration: none;
      color: var(--text-brown);
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(235, 175, 195, 0.12);
      transition: all 0.2s ease;
    }

    .pill-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(235, 175, 195, 0.25);
      border-color: #f7a9ca;
    }

    /* Grid Links (สไตล์รูปที่ 2) */
    .grid-links {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .grid-btn {
      background: var(--white);
      border: 1.5px solid #ffdbe8;
      border-radius: 20px;
      padding: 16px 8px;
      text-align: center;
      text-decoration: none;
      color: var(--text-brown);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 8px rgba(235, 175, 195, 0.1);
    }

    .grid-btn:hover {
      transform: translateY(-3px);
      border-color: #f7a9ca;
    }

    .grid-btn .icon {
      font-size: 22px;
    }

    .grid-btn .text {
      font-size: 12px;
      font-weight: 700;
    }

    /* Bottom Navigation Tab */
    .bottom-nav-wrap {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 380px;
      z-index: 99;
    }

    .bottom-nav {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1.5px solid #ffdce9;
      border-radius: 30px;
      padding: 6px;
      display: flex;
      box-shadow: 0 8px 24px rgba(235, 160, 190, 0.25);
    }

    .nav-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      border-radius: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .nav-btn.active {
      background: linear-gradient(135deg, #f9adc9, #ef91b5);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(240, 140, 175, 0.35);
    }
  </style>
</head>
<body>
  <main class="container">
    <!-- Cover Banner -->
    <header class="banner-container">
      <!-- สามารถเปลี่ยนภาพ Banner ได้ที่ src -->
      <img class="banner-img" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80" alt="Banner">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar">🐰</div>
        <!-- หรือใส่รูปโปรไฟล์จริง: <img class="profile-avatar" src="avatar.jpg" alt="Profile"> -->
      </div>
    </header>

    <!-- Profile Info -->
    <section class="profile-info">
      <h1 class="shop-title">MONA SHOP ♡</h1>
      <p class="shop-bio">welcome to my little space 🎀</p>
    </section>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-item">
        <div class="num">1000</div>
        <div class="label">♡ followers</div>
      </div>
      <div class="stat-item">
        <div class="num">20</div>
        <div class="label">♡ following</div>
      </div>
      <div class="stat-item">
        <div class="num">46</div>
        <div class="label">♡ reviews</div>
      </div>
    </div>

    <!-- Music Player Card -->
    <div class="music-card">
      <div class="music-icon">🎵</div>
      <div class="music-details">
        <div class="song-title">SWEAT</div>
        <div class="song-artist">KISS OF LIFE</div>
      </div>
      <button class="play-btn" type="button" aria-label="Play song">▶</button>
    </div>

    <!-- Section: Contact Me -->
    <section class="section-card">
      <div class="section-header">♡ Contact Me ♡</div>
      <div class="links-list">
        <a class="pill-link" href="https://line.me/" target="_blank" rel="noopener">
          💬 <span>LINE Official</span>
        </a>
        <a class="pill-link" href="https://instagram.com/" target="_blank" rel="noopener">
          📸 <span>Instagram</span>
        </a>
      </div>

      <!-- โซเชียลแบบ Grid 3 ช่องตามตัวอย่างรูปที่ 2 -->
      <div class="grid-links">
        <a class="grid-btn" href="https://facebook.com/" target="_blank" rel="noopener">
          <span class="icon">💌</span>
          <span class="text">♡ fb ♡</span>
        </a>
        <a class="grid-btn" href="https://x.com/" target="_blank" rel="noopener">
          <span class="icon">💖</span>
          <span class="text">X ! ♡</span>
        </a>
        <a class="grid-btn" href="https://tiktok.com/" target="_blank" rel="noopener">
          <span class="icon">🎶</span>
          <span class="text">TikTok ♡</span>
        </a>
      </div>
    </section>

    <!-- Floating Bottom Navigation -->
    <nav class="bottom-nav-wrap">
      <div class="bottom-nav">
        <a href="#main" class="nav-btn active">♡ Main</a>
        <a href="#reviews" class="nav-btn">♡ Reviews</a>
      </div>
    </nav>
  </main>
</body>
</html>
